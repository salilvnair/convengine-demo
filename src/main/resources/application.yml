server:
  port: 8080

spring:
  application:
    name: convengine

  datasource:
    url: jdbc:postgresql://localhost:5432/convengine?currentSchema=v2,public
    username: convengine_user
    password: convengine_pwd
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET application_name = 'convengine-demo';

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none      # VERY IMPORTANT: DB managed manually
      naming:
        physical-strategy: com.github.salilvnair.ccf.config.hibernate.CcfPhysicalNamingStrategy
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  jackson:
    serialization:
      indent_output: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE


convengine:
  audit:
    enabled: true
#    persist-meta: false
#    cache-inspector: false
#    include-stages: [PIPELINE_TIMING]
  schema:
    active: v2
  demo:
    stream-mode: SSE
    step-hook:
      enabled: true

    mockey:
      base-url: http://localhost:31333
      api-key: demo-live-key

  mcp:
    tool-max-loops: 10
    tool-call-delay-ms: 0
    tool-call-delay-after-calls: 4
    tool-call-delay-after-ms: 2000
    http-api:
      defaults:
        connect-timeout-ms: 2000
        read-timeout-ms: 5000
        max-attempts: 2
        initial-backoff-ms: 200
        max-backoff-ms: 2000
        backoff-multiplier: 2.0
        circuit-breaker-enabled: true
        circuit-failure-threshold: 5
        circuit-open-ms: 30000
        retry-status-codes: [429, 502, 503, 504]
        retry-on-io-exception: true
    db:
      query:
        mode: semantic # semantic-catalog | knowledge-graph | semantic
      semantic:
        enabled: true
        sql-dialect: postgres
        timezone: America/Chicago
        vector:
          enabled: true
          feedback-enabled: true # when false, USER_QUERY feedback embeddings are ignored
          table: ce_semantic_concept_embedding
          namespace-column: namespace
          target-type-column: target_type
          target-name-column: target_name
          embedding-column: embedding
          metadata-column: metadata_json
          max-results: 20

  experimental:
    enabled: true

  llm:
    provider: openai
    temperature: 0.3
    openai:
      api-key: ${OPENAI_API_KEY}
      model: gpt-4.1
      base-url: https://api.openai.com
    lmstudio:
        api-key: ${LMSTUDIO_API_KEY}
        model: openai/gpt-oss-20b
        base-url: http://localhost:1234

  transport:
    sse:
      enabled: true
      emitter-timeout-ms: 1800000
    stomp:
      enabled: false
      endpoint: /ws-convengine
      app-destination-prefix: /app
      topic-prefix: /topic
      audit-destination-base: /topic/convengine/audit
      allowed-origin-pattern: "*"
      sock-js: true

  tables:
    # Core CE tables (keep your existing ones)
    CONFIG: CE_CONFIG
    AUDIT: CE_AUDIT
    CONTAINER_CONFIG: CE_CONTAINER_CONFIG
    CONVERSATION: CE_CONVERSATION
    CONVERSATION_HISTORY: CE_CONVERSATION_HISTORY
    INTENT: CE_INTENT
    INTENT_CLASSIFIER: CE_INTENT_CLASSIFIER
    LLM_CALL_LOG: CE_LLM_CALL_LOG
    MCP_DB_TOOL: CE_MCP_DB_TOOL
    MCP_TOOL: CE_MCP_TOOL
    MCP_PLANNER: CE_MCP_PLANNER
    OUTPUT_SCHEMA: CE_OUTPUT_SCHEMA
    POLICY: CE_POLICY
    PENDING_ACTION: CE_PENDING_ACTION
    PROMPT_TEMPLATE: CE_PROMPT_TEMPLATE
    RESPONSE: CE_RESPONSE
    RULE: CE_RULE
    VALIDATION_SNAPSHOT: CE_VALIDATION_SNAPSHOT

    # YAML-derived semantic layer tables (new)
    SEMANTIC_MODEL: CE_SEMANTIC_MODEL
    SEMANTIC_SETTING: CE_SEMANTIC_SETTING
    SEMANTIC_SOURCE_TABLE: CE_SEMANTIC_SOURCE_TABLE
    SEMANTIC_SOURCE_COLUMN: CE_SEMANTIC_SOURCE_COLUMN
    SEMANTIC_ENTITY: CE_SEMANTIC_ENTITY
    SEMANTIC_RELATIONSHIP: CE_SEMANTIC_RELATIONSHIP
    SEMANTIC_LEXICON: CE_SEMANTIC_LEXICON
    SEMANTIC_JOIN_HINT: CE_SEMANTIC_JOIN_HINT
    SEMANTIC_VALUE_PATTERN: CE_SEMANTIC_VALUE_PATTERN
    SEMANTIC_METRIC: CE_SEMANTIC_METRIC
    SEMANTIC_INTENT_RULE: CE_SEMANTIC_INTENT_RULE
    SEMANTIC_RULE_ALLOWED_TABLE: CE_SEMANTIC_RULE_ALLOWED_TABLE
    SEMANTIC_RULE_DENY_OPERATION: CE_SEMANTIC_RULE_DENY_OPERATION
    SEMANTIC_RULE_CONFIG: CE_SEMANTIC_RULE_CONFIG

    # Agent-2 semantic query tables (if you still use that flow)
    SEMANTIC_AMBIGUITY_OPTION: CE_SEMANTIC_AMBIGUITY_OPTION
    SEMANTIC_CONCEPT: CE_SEMANTIC_CONCEPT
    SEMANTIC_CONCEPT_EMBEDDING: CE_SEMANTIC_CONCEPT_EMBEDDING
    SEMANTIC_JOIN_PATH: CE_SEMANTIC_JOIN_PATH
    SEMANTIC_MAPPING: CE_SEMANTIC_MAPPING
    SEMANTIC_QUERY_CLASS: CE_SEMANTIC_QUERY_CLASS
    SEMANTIC_QUERY_FAILURES: CE_SEMANTIC_QUERY_FAILURES
    SEMANTIC_SYNONYM: CE_SEMANTIC_SYNONYM

ccf:
  core:
    tables:
      PAGE_COMMON_QUERY: ZP_PAGE_COMMON_QUERY
      SECTION_INFO: ZP_SECTION_INFO
      CONTAINER_INFO: ZP_CONTAINER_INFO
      CONTAINER_FIELD_INFO: ZP_CONTAINER_FIELD_INFO
      CONTAINER_QUERY_INFO: ZP_CONTAINER_QUERY_INFO